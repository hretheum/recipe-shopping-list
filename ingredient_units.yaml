# Dictionary of preferred shopping units.
# Key: ingredient name in the singular, lowercase, in the language of your recipes.
# unit    - the unit you actually buy in.
# note    - a hint for the LLM.
# round_to - round the SUM up to a multiple of this value (e.g. 0.5 kg).
# integer - the unit is countable; quantities are rounded up to whole numbers.
# Copy this file into your vault (default path in the settings: ingredient_units.yaml).

dill: {unit: bunch, integer: true, note: "do not weigh, buy by the bunch"}
chives: {unit: bunch, integer: true}
butter: {unit: stick, integer: true, note: "one stick = 200 g"}
flour: {unit: kg, round_to: 0.5}
milk: {unit: l, round_to: 0.5}
egg: {unit: pcs, integer: true, note: "round to 10 for larger amounts"}
garlic: {unit: head, integer: true, note: "convert cloves to heads: 1 head is about 10 cloves"}
lemon: {unit: pcs, integer: true}
breadcrumbs: {unit: package, integer: true, note: "one package = 500 g"}
